services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: uml_collab
      POSTGRES_PASSWORD: uml_collab
      POSTGRES_DB: uml_collab
    ports:
      - "5442:5432"
    volumes:
      - uml_collab_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uml_collab"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: valexbruno/umlcollab:backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/uml_collab
      DB_USERNAME: uml_collab
      DB_PASSWORD: uml_collab
      JWT_SECRET: ${JWT_SECRET:-cambia-esto-en-serio}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      CORS_ALLOWED_ORIGINS: http://localhost:4210
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  frontend:
    build: ./frontend
    image: valexbruno/umlcollab:frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4210:80"

volumes:
  uml_collab_db_data: