spring:
  application:
    name: uml-collab-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:postgres}

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}

umlcollab:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-for-uml-collab-dev-only-please-rotate}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  lock:
    ttl-seconds: ${LOCK_TTL_SECONDS:20}
  ai:
    provider: anthropic
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-5-20250929}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1/messages}
    enabled: ${AI_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4210}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/uml_collab}
    username: ${DB_USERNAME:uml_collab}
    password: ${DB_PASSWORD:uml_collab}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: dev-h2
  datasource:
    url: jdbc:h2:mem:umlcollab;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
